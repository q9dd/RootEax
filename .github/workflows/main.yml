name: Build Root Eax

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build eaxcore.dll
        shell: cmd
        working-directory: native/eaxcore
        run: cl /nologo /LD /O2 /MT /EHsc /std:c++17 /utf-8 /DNOMINMAX /DNDEBUG eaxcore.cpp /Fe:..\..\src\RootEax\eaxcore.dll

      - name: Publish exe
        shell: pwsh
        run: |
          dotnet publish src/RootEax/RootEax.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o out

      - uses: actions/upload-artifact@v4
        with:
          name: RootEax-win-x64
          path: out/RootEax.exe
